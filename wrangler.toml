name = "quantrisk-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Uncomment after creating KV namespace with: wrangler kv:namespace create RETURNS_CACHE
[[kv_namespaces]]
binding = "RETURNS_CACHE"
id = "3e073464f42e4820b2683d981f2132d9"

[build]
command = "npm run build"

# Uncomment for custom domain
# [[routes]]
# pattern = "quantrisk.yourdomain.com/*"
# zone_name = "yourdomain.com"
