name = "quantrisk-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# Uncomment after creating KV namespace with: wrangler kv:namespace create RETURNS_CACHE
# [[kv_namespaces]]
# binding = "RETURNS_CACHE"
# id = "your-kv-namespace-id"

[build]
command = "npm run build"

# Uncomment for custom domain
# [[routes]]
# pattern = "quantrisk.yourdomain.com/*"
# zone_name = "yourdomain.com"
